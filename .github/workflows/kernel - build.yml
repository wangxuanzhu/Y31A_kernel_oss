name: Linux Kernel Build for Y31A ARM
on:
  workflow_dispatch: {}
  push:
    branches:
      - main # 根据实际分支调整

jobs:
  build_kernel:
    runs - on: ubuntu - 22.04
    steps:
      - name: Cache apt packages
        id: cache_apt_packages
        uses: actions/cache@v3
        with:
          path: /home/runner/.cache/apt
          key: ${{ runner.os }} - apt - ${{ hashFiles('**/requirements.txt') }}
          restore - keys: |
            ${{ runner.os }} - apt -
      - name: Cache build output
        id: cache_build_output
        uses: actions/cache@v3
        with:
          path: out
          key: ${{ runner.os }} - kernel - build - ${{ hashFiles('**/*.c', '**/*.h', '.config') }}
          restore - keys: |
            ${{ runner.os }} - kernel - build -
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up build environment for ARM
        if: steps.cache_apt_packages.outputs.cache - hit!= 'true'
        run: |
          sudo apt - get update
          sudo apt - get install - y build - essential bc flex bison libssl - dev libelf - dev device - tree - gcc - arm - linux - gnueabi
      - name: Configure for ARM architecture
        run: |
          make ARCH=arm O=out ARCH=arm CROSS_COMPILE=arm - linux - gnueabi - vivo_y31a_defconfig
      - name: Check config status
        run: |
          if [ $? -ne 0 ]; then
            echo "Kernel configuration failed"
            exit 1
          fi
      - name: Build Linux kernel for ARM
        if: steps.cache_build_output.outputs.cache - hit!= 'true'
        run: |
          make ARCH=arm O=out ARCH=arm CROSS_COMPILE=arm - linux - gnueabi - -j$(nproc) &> build.log
      - name: Check kernel build status
        run: |
          if [ $? -ne 0 ]; then
            echo "Kernel build failed"
            exit 1
          fi
      - name: Extract firmware
        run: |
          mkdir -p extracted_firmware
          find. -name "*panel*firmware*" -exec cp -r {} extracted_firmware/panel \;
          find. -name "*wifi*firmware*" -exec cp -r {} extracted_firmware/wifi \;
          find. -name "*modem*firmware*" -exec cp -r {} extracted_firmware/modem \;
      - name: Check firmware extraction status
        run: |
          if [ $? -ne 0 ]; then
            echo "Firmware extraction failed"
            exit 1
          fi
      - name: Output kernel image path
        run: |
          echo "Compiled kernel image path: out/arch/arm/boot/zImage"
      - name: Upload build log as artifact
        uses: actions/upload - artifact@v3
        with:
          name: build - log
          path: build.log
      - name: Upload build output as artifact
        uses: actions/upload - artifact@v3
        with:
          name: build - output
          path: out
      - name: Create Release
        uses: softprops/action - github - release@v4
        with:
          files: |
            extracted_firmware/**
          tag_name: ${{ github.sha }}
          release_name: Y31A Linux Kernel Firmware Release for ARM
          body: Release of panel, wifi, and modem firmware from Y31A Linux kernel build for ARM
          draft: false
          prerelease: false
      - name: Send Slack notification on failure
        if: failure()
        uses: peter - evans/slack - notification@v1.3.0
        with:
          token: ${{ secrets.SLACK_TOKEN }}
          channel: '#your - channel'
          title: 'Y31A Kernel Build Failed'
          message: 'The Y31A kernel build workflow has failed. Check the workflow logs for details.'
