name: Linux Kernel Build for Y31A ARM
on:
  workflow_dispatch: {}
  push:
    branches:
      - main # 根据实际分支调整

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Cache apt packages
        uses: actions/cache@v3
        with:
          path: /home/runner/.cache/apt
          key: ${{ runner.os }} - apt - ${{ hashFiles('**/requirements.txt') }}
          restore - keys: |
            ${{ runner.os }} - apt -
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up build environment for ARM
        run: |
          sudo apt - get update
          sudo apt - get install - y build - essential bc flex bison libssl - dev libelf - dev device - tree - gcc - arm - linux - gnueabi
      - name: Configure for ARM architecture
        run: |
          make ARCH=arm O=out ARCH=arm CROSS_COMPILE=arm - linux - gnueabi - vivo_y31a_defconfig
      - name: Check config status
        run: |
          if [ $? -ne 0 ]; then
            echo "Kernel configuration failed"
            exit 1
          fi
      - name: Build Linux kernel for ARM
        run: |
          make ARCH=arm O=out ARCH=arm CROSS_COMPILE=arm - linux - gnueabi - -j$(nproc) &> build.log
      - name: Check kernel build status
        run: |
          if [ $? -ne 0 ]; then
            echo "Kernel build failed"
            exit 1
          fi
      - name: Extract firmware
        run: |
          mkdir -p extracted_firmware
          find. -name "*panel*firmware*" -exec cp -r {} extracted_firmware/panel \;
          find. -name "*wifi*firmware*" -exec cp -r {} extracted_firmware/wifi \;
          find. -name "*modem*firmware*" -exec cp -r {} extracted_firmware/modem \;
      - name: Check firmware extraction status
        run: |
          if [ $? -ne 0 ]; then
            echo "Firmware extraction failed"
            exit 1
          fi
      - name: Output kernel image path
        run: |
          echo "Compiled kernel image path: out/arch/arm/boot/zImage"
      - name: Create Release
        uses: softprops/action - github - release@v1
        with:
          files: |
            extracted_firmware/**
          tag_name: ${{ github.sha }}
          release_name: Y31A Linux Kernel Firmware Release for ARM
          body: Release of panel, wifi, and modem firmware from Y31A Linux kernel build for ARM
          draft: false
          prerelease: false
